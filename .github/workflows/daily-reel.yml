name: Codigo Zero Reels Autopilot

on:
  schedule:
    # Limite maximo da API Meta: a cada 15 min (96/dia, teto oficial 100/24h com margem de 4 slots)
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: codigo-zero-reel
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Whisper tiny model for instant word-sync
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: faster-whisper-tiny-v1

      - name: Install system and Python deps
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          pip install -q edge-tts faster-whisper

      - name: Generate Codigo Zero Reel v3 (Emotional Female Voice + 4-Scene 1080x1920 Motion Graphics)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Upload video to temporary GitHub Release for Meta API
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cz-reel-${{ github.run_number }}-${{ github.run_attempt }}
          name: Codigo Zero Reel v3 #${{ github.run_number }}
          files: |
            build/reel_final.mp4
            build/caption.txt
            build/meta.json

      - name: Publish Reel to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          VIDEO_PUBLIC_URL: https://github.com/${{ github.repository }}/releases/download/cz-reel-${{ github.run_number }}-${{ github.run_attempt }}/reel_final.mp4
        run: python publish.py

      - name: Commit updated history.json
        run: |
          if [ -f build/.published ]; then
            git config user.name "codigozero-bot"
            git config user.email "bot@users.noreply.github.com"
            git add history.json
            git diff --staged --quiet || (git commit -m "chore: update codigo zero reel history" && git pull --rebase origin main && git push)
          else
            echo "Publicação pulada nesta execução; history.json mantido intacto."
          fi

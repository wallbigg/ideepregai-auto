name: Codigo Zero Reels Autopilot

on:
  schedule:
    # 12 horarios explicitos/dia (BRT = UTC-3), minuto :23 fora de pico:
    # 07:23 · 09:23 · 11:23 · 13:23 · 15:23 · 17:23 · 18:23 · 19:23 · 20:23 · 21:23 · 23:23 · 01:23 BRT
    - cron: "23 4 * * *"
    - cron: "23 10 * * *"
    - cron: "23 12 * * *"
    - cron: "23 14 * * *"
    - cron: "23 16 * * *"
    - cron: "23 18 * * *"
    - cron: "23 20 * * *"
    - cron: "23 21 * * *"
    - cron: "23 22 * * *"
    - cron: "23 23 * * *"
    - cron: "23 0 * * *"
    - cron: "23 2 * * *"
  workflow_dispatch:

concurrency:
  group: codigo-zero-reel
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Cache Whisper tiny model for instant word-sync
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/huggingface
          key: faster-whisper-tiny-v1

      - name: Install system and Python deps
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          pip install -q edge-tts faster-whisper numpy

      - name: Generate Codigo Zero Cinema Storytelling v5 (8-Scene Real Movie + Orchestral Score + Dual Voices)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Upload video to temporary GitHub Release for Meta API
        id: release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: cz-reel-${{ github.run_number }}-${{ github.run_attempt }}
          name: Codigo Zero Cinema v5 #${{ github.run_number }}
          files: |
            build/reel_final.mp4
            build/caption.txt
            build/caption_tiktok.txt
            build/meta.json

      - name: Publish Reel to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          VIDEO_PUBLIC_URL: https://github.com/${{ github.repository }}/releases/download/cz-reel-${{ github.run_number }}-${{ github.run_attempt }}/reel_final.mp4
        run: python publish.py

      - name: Publish Video to TikTok
        env:
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_SESSIONID: ${{ secrets.TIKTOK_SESSIONID }}
          TIKTOK_COOKIES_JSON: ${{ secrets.TIKTOK_COOKIES_JSON }}
          VIDEO_PUBLIC_URL: https://github.com/${{ github.repository }}/releases/download/cz-reel-${{ github.run_number }}-${{ github.run_attempt }}/reel_final.mp4
        run: python publish_tiktok.py

      - name: Commit updated history.json
        run: |
          if [ -f build/.published ]; then
            git config user.name "codigozero-bot"
            git config user.email "bot@users.noreply.github.com"
            git add history.json
            git diff --staged --quiet || (git commit -m "chore: update codigo zero reel history" && git pull --rebase origin main && git push)
          else
            echo "Publicação pulada nesta execução; history.json mantido intacto."
          fi

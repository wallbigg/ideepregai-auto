name: Daily Christian Reel

on:
  schedule:
    # 10 videos/dia (BRT = UTC-3), em minutos fora de pico para evitar atraso no cron do GitHub:
    # 07:17, 08:47, 10:17, 11:47, 13:17, 14:47, 16:17, 17:47, 19:17, 20:47 BRT
    - cron: "17 10 * * *"
    - cron: "47 11 * * *"
    - cron: "17 13 * * *"
    - cron: "47 14 * * *"
    - cron: "17 16 * * *"
    - cron: "47 17 * * *"
    - cron: "17 19 * * *"
    - cron: "47 20 * * *"
    - cron: "17 22 * * *"
    - cron: "47 23 * * *"
  workflow_dispatch:

concurrency:
  group: daily-christian-reel
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system and Python deps
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          pip install -q edge-tts

      - name: Generate Daily Reel (Script + Voice + B-roll + Motion + Piano)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Upload video to temporary GitHub Release for Meta API
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: reel-${{ github.run_number }}-${{ github.run_attempt }}
          name: Daily Reel ${{ github.run_number }}
          files: build/reel_final.mp4

      - name: Publish Reel to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          VIDEO_PUBLIC_URL: https://github.com/${{ github.repository }}/releases/download/reel-${{ github.run_number }}-${{ github.run_attempt }}/reel_final.mp4
        run: python publish.py

      - name: Commit updated history.json
        run: |
          git config user.name "ideepregai-bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.json
          git diff --staged --quiet || (git commit -m "chore: update posted verses history" && git pull --rebase origin main && git push)

name: Codigo Zero Reels Autopilot

on:
  schedule:
    # 3 Reels/dia em horários de pico emocional (BRT = UTC-3), evitando spam/bloqueio da Meta (5258005):
    # 08:17 BRT (11:17 UTC) · 13:17 BRT (16:17 UTC) · 21:17 BRT (00:17 UTC - pré-Zona Morta 22h-02h)
    - cron: "17 11 * * *"
    - cron: "17 16 * * *"
    - cron: "17 0 * * *"
  workflow_dispatch:

concurrency:
  group: codigo-zero-reel
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system and Python deps
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          pip install -q edge-tts

      - name: Generate Codigo Zero Reel (Script + Voice + B-roll + Motion + Piano)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Upload video to temporary GitHub Release for Meta API
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cz-reel-${{ github.run_number }}-${{ github.run_attempt }}
          name: Codigo Zero Reel ${{ github.run_number }}
          files: |
            build/reel_final.mp4
            build/caption.txt

      - name: Publish Reel to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          VIDEO_PUBLIC_URL: https://github.com/${{ github.repository }}/releases/download/cz-reel-${{ github.run_number }}-${{ github.run_attempt }}/reel_final.mp4
        run: python publish.py

      - name: Commit updated history.json
        run: |
          if [ -f build/.published ]; then
            git config user.name "codigozero-bot"
            git config user.email "bot@users.noreply.github.com"
            git add history.json
            git diff --staged --quiet || (git commit -m "chore: update codigo zero reel history" && git pull --rebase origin main && git push)
          else
            echo "Publicação pulada nesta execução; history.json mantido intacto."
          fi

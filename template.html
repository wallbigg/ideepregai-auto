<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,700;1,600;1,700&family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ink: #faf7f2;
        --gold: #d4af6a;
        --gold-light: #f4e3be;
        --crimson: #ff5c77;
        --burgundy: #9e2e46;
        --sage: #5cd3a6;
        --muted: #cfc6d6;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1080px; height: 1920px; overflow: hidden;
        background: #08060b;
        font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
        color: var(--ink);
      }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }

      /* Native multi-cut moody B-roll video (zero colorkey artifacts; color-graded in FFmpeg!) */
      #bgVideo {
        position: absolute; inset: 0; width: 1080px; height: 1920px;
        object-fit: cover; z-index: 0;
      }

      /* Cinematic dark vignette & luxury plum-gold atmospheric wash */
      .vignette {
        position: absolute; inset: 0; z-index: 1; pointer-events: none;
        background:
          radial-gradient(circle at 50% 24%, rgba(158, 46, 70, 0.22) 0%, rgba(10, 7, 14, 0.25) 48%, rgba(6, 4, 9, 0.88) 100%),
          linear-gradient(180deg, rgba(8, 6, 11, 0.72) 0%, rgba(8, 6, 11, 0.18) 26%, rgba(8, 6, 11, 0.28) 65%, rgba(8, 6, 11, 0.92) 100%);
      }

      /* Safe zone container: top 260px, bottom 420px, left 84px, right 205px (clears IG right rail & caption!) */
      .stage {
        position: absolute;
        top: 260px; left: 84px; right: 205px; bottom: 420px;
        z-index: 5;
        display: flex; flex-direction: column; justify-content: space-between;
        align-items: center;
      }

      /* Top micro-brand header */
      .top-bar {
        width: 100%; display: flex; justify-content: space-between; align-items: center;
        padding-bottom: 14px; border-bottom: 1px solid rgba(212, 175, 106, 0.28);
      }
      .brand-tag {
        font-family: "JetBrains Mono", monospace;
        font-size: 23px; font-weight: 600; letter-spacing: 0.16em;
        color: var(--gold-light); text-transform: uppercase;
      }
      .rec-dot-wrap {
        display: flex; align-items: center; gap: 10px;
        font-family: "JetBrains Mono", monospace; font-size: 21px;
        color: var(--crimson); font-weight: 600; letter-spacing: 0.1em;
      }
      .rec-dot {
        width: 12px; height: 12px; border-radius: 50%;
        background: var(--crimson); box-shadow: 0 0 14px var(--crimson);
      }

      /* Visual Hook Slot (Frame 0 Pattern Interrupt) */
      .hook-slot {
        width: 100%; min-height: 330px;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
      }

      /* Archetype 1: Realistic Frosted-Glass WhatsApp Notification */
      .wa-card {
        width: 100%;
        background: rgba(20, 17, 26, 0.84);
        backdrop-filter: blur(22px);
        border: 1.5px solid rgba(255, 255, 255, 0.16);
        border-radius: 28px;
        padding: 28px 30px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.72), 0 0 0 1px rgba(212, 175, 106, 0.18);
      }
      .wa-head {
        display: flex; align-items: center; justify-content: space-between;
        margin-bottom: 16px;
      }
      .wa-app {
        display: flex; align-items: center; gap: 12px;
        font-family: "JetBrains Mono", monospace; font-size: 22px;
        color: #9ce4c8; font-weight: 600; letter-spacing: 0.08em;
      }
      .wa-icon {
        width: 36px; height: 36px; border-radius: 10px;
        background: linear-gradient(135deg, #25d366, #128c7e);
        display: flex; align-items: center; justify-content: center;
        color: #fff; font-size: 20px; font-weight: 800;
      }
      .wa-time {
        font-family: "JetBrains Mono", monospace; font-size: 21px; color: #a79db0;
      }
      .wa-sender {
        font-size: 32px; font-weight: 800; color: #fff; margin-bottom: 8px; text-align: left;
      }
      .wa-msg {
        font-size: 36px; line-height: 1.28; color: #f1eaf6; font-weight: 600; text-align: left;
      }
      .alert-strip {
        margin-top: 22px;
        display: inline-block;
        font-family: "JetBrains Mono", monospace;
        font-size: 24px; font-weight: 700; letter-spacing: 0.12em;
        color: #fff; background: linear-gradient(135deg, #c93452, #8c1d34);
        padding: 12px 26px; border-radius: 12px;
        box-shadow: 0 10px 28px rgba(158, 46, 70, 0.55);
      }

      /* Archetype 2: Clinical / Diagnostic Dark Luxury Card */
      .timer-card {
        width: 100%;
        background: linear-gradient(155deg, rgba(36, 17, 30, 0.88), rgba(16, 12, 22, 0.90));
        backdrop-filter: blur(20px);
        border: 1.5px solid rgba(212, 175, 106, 0.55);
        border-radius: 28px;
        padding: 30px 30px;
        text-align: center;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.72);
      }
      .timer-label {
        font-family: "JetBrains Mono", monospace; font-size: 22px;
        color: var(--gold); letter-spacing: 0.18em; text-transform: uppercase;
        margin-bottom: 12px; font-weight: 700;
      }
      .timer-big {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: 86px; line-height: 1.0; font-weight: 700;
        color: #fffaf2; margin-bottom: 12px;
      }
      .timer-sub {
        font-size: 32px; line-height: 1.28; color: var(--gold-light); font-weight: 700;
      }

      /* Archetype 3: Split Contrast Card (Ilusão vs Realidade) */
      .contrast-card {
        width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
      }
      .contrast-col {
        background: rgba(16, 12, 22, 0.88);
        backdrop-filter: blur(18px);
        border-radius: 22px; padding: 24px 20px; text-align: left;
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.65);
      }
      .contrast-left { border: 1.5px solid rgba(255, 92, 119, 0.6); }
      .contrast-right { border: 1.5px solid rgba(212, 175, 106, 0.65); }
      .c-tag {
        font-family: "JetBrains Mono", monospace; font-size: 20px; font-weight: 700;
        letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 12px;
      }
      .c-tag.red { color: var(--crimson); }
      .c-tag.gold { color: var(--gold-light); }
      .c-body {
        font-size: 31px; line-height: 1.25; font-weight: 800; color: #fff;
      }

      /* Word-by-Word Kinetic Captions Zone (Center-Lower Safe Zone) */
      .captions-stage {
        position: relative;
        width: 100%; height: 340px;
        display: flex; align-items: center; justify-content: center;
      }
      .cap-chunk {
        position: absolute;
        width: 100%;
        display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
        gap: 14px 16px;
        padding: 18px 14px;
        opacity: 0;
      }
      .w {
        display: inline-block;
        font-size: 62px; line-height: 1.16; font-weight: 800;
        letter-spacing: -0.02em;
        color: rgba(250, 247, 242, 0.88);
        text-shadow:
          0 5px 0 rgba(0, 0, 0, 0.92),
          0 10px 28px rgba(0, 0, 0, 0.96);
        transform-origin: center center;
      }
      .w.active-gold {
        color: var(--gold-light);
        text-shadow:
          0 5px 0 rgba(0, 0, 0, 0.95),
          0 0 28px rgba(212, 175, 106, 0.65);
      }
      .w.active-red {
        color: var(--crimson);
        text-shadow:
          0 5px 0 rgba(0, 0, 0, 0.95),
          0 0 28px rgba(255, 92, 119, 0.65);
      }

      /* Final CTA Banner (slides in during last 3.6s) */
      .cta-card {
        width: 100%;
        background: linear-gradient(135deg, rgba(240, 223, 184, 0.96), rgba(198, 158, 87, 0.96));
        color: #120e18;
        border-radius: 22px;
        padding: 22px 26px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.72);
        opacity: 0;
      }
      .cta-main {
        font-family: "JetBrains Mono", monospace;
        font-size: 31px; font-weight: 700; letter-spacing: 0.04em;
      }
      .cta-sub {
        font-size: 24px; font-weight: 700; margin-top: 6px; color: #2b1521;
      }

      /* Bottom progress bar */
      .bottom-wrap {
        width: 100%; display: flex; flex-direction: column; gap: 14px; align-items: center;
      }
      .progress-track {
        width: 100%; height: 6px; background: rgba(255, 255, 255, 0.18);
        border-radius: 99px; overflow: hidden;
      }
      .progress-fill {
        width: 0%; height: 100%;
        background: linear-gradient(90deg, #ff5c77, #d4af6a, #5cd3a6);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__DURATION__" data-width="1080" data-height="1920">
      <video
        id="bgVideo"
        class="clip"
        data-start="0"
        data-duration="__DURATION__"
        data-track-index="0"
        src="assets/bg.mp4"
        muted
      ></video>
      <div class="vignette"></div>

      <div class="stage">
        <div class="top-bar">
          <div class="brand-tag">CÓDIGO ZERO • __BADGE__</div>
          <div class="rec-dot-wrap"><span class="rec-dot" id="recDot"></span><span>Z.E.R.O.</span></div>
        </div>

        <div class="hook-slot" id="hookSlot">
          __HOOK_CARD_HTML__
        </div>

        <div class="captions-stage" id="captionsStage">
          __CAPTIONS_HTML__
        </div>

        <div class="bottom-wrap">
          <div class="cta-card" id="ctaCard">
            <div class="cta-main">COMENTE "ZERO" AQUI 👇</div>
            <div class="cta-sub">ou chame no WhatsApp da bio • (12) 99659-3222</div>
          </div>
          <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const DUR = __DURATION__;
      const CHUNKS = __CHUNKS_JSON__;
      const tl = gsap.timeline({ paused: true });

      // Smooth progress bar across the full Reel
      tl.to("#progressFill", { width: "100%", duration: DUR, ease: "none" }, 0);

      // Subtle pulse on top indicator dot (deterministic finite timeline)
      for (let t = 0; t < DUR - 0.8; t += 1.2) {
        tl.to("#recDot", { opacity: 0.3, duration: 0.55, ease: "sine.inOut" }, t);
        tl.to("#recDot", { opacity: 1.0, duration: 0.55, ease: "sine.inOut" }, t + 0.55);
      }

      // Frame-0 Pattern Interrupt Hook Card entrance (snappy spring-like drop)
      tl.fromTo(
        "#hookCard",
        { opacity: 0, y: -42, scale: 0.92 },
        { opacity: 1, y: 0, scale: 1, duration: 0.36, ease: "back.out(1.4)" },
        0.04
      );
      // Subtle breath on hook card mid-way to keep visual motion alive
      tl.to("#hookCard", { y: -6, duration: Math.max(1, DUR * 0.45), ease: "sine.inOut" }, 0.5);
      tl.to("#hookCard", { y: 0, duration: Math.max(1, DUR * 0.45), ease: "sine.inOut" }, 0.5 + Math.max(1, DUR * 0.45));

      // Word-by-word synchronized kinetic captions
      CHUNKS.forEach((chunk, ci) => {
        const cid = "#chunk-" + ci;
        const cStart = Math.max(0, chunk.start);
        const cEnd = Math.min(DUR, chunk.end);
        tl.fromTo(
          cid,
          { opacity: 0, y: 18, scale: 0.95 },
          { opacity: 1, y: 0, scale: 1, duration: 0.14, ease: "power3.out" },
          cStart
        );
        chunk.words.forEach((w, wi) => {
          const wid = "#w-" + ci + "-" + wi;
          const activeColor = w.emphasis ? "#ff5c77" : "#f4e3be";
          const wDur = Math.max(0.12, (w.end - w.start));
          tl.to(
            wid,
            { scale: 1.1, color: activeColor, duration: 0.08, ease: "power2.out" },
            Math.max(0, w.start)
          );
          tl.to(
            wid,
            { scale: 1.0, duration: 0.1, ease: "power2.in" },
            Math.max(0, w.start + Math.min(wDur, 0.28))
          );
        });
        if (ci < CHUNKS.length - 1) {
          tl.to(cid, { opacity: 0, y: -12, duration: 0.10, ease: "power2.in" }, Math.max(cStart + 0.15, cEnd - 0.08));
        }
      });

      // CTA Card pops in smoothly during the final 4 seconds
      const ctaIn = Math.max(2.0, DUR - 4.0);
      tl.fromTo(
        "#ctaCard",
        { opacity: 0, y: 28, scale: 0.94 },
        { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "back.out(1.3)" },
        ctaIn
      );

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

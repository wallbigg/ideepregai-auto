<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ink: #faf7f0;
        --muted: #dbd5c9;
        --gold: #f5b73b;
        --crimson: #ff3b5c;
        --sage: #39c993;
        --obsidian: #08090d;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--obsidian);
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        color: var(--ink);
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--obsidian);
      }

      /* ── Layer 1: Full-Bleed Multi-Shot Cinema Movie (8 unique real HD scenes) ── */
      #cinemaStage {
        position: absolute;
        inset: 0;
        z-index: 1;
        overflow: hidden;
        background: #08090d;
      }

      .shot-vid {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }

      /* Cinema lighting feather: keeps faces/subject bright while protecting text legibility */
      .cinema-veil {
        position: absolute;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        background: linear-gradient(
          180deg,
          rgba(7, 8, 12, 0.56) 0%,
          rgba(7, 8, 12, 0.14) 28%,
          rgba(7, 8, 12, 0.16) 54%,
          rgba(7, 8, 12, 0.68) 78%,
          rgba(7, 8, 12, 0.88) 100%
        );
      }

      /* Subtle drifting cinema bokeh specks */
      .bokeh-layer {
        position: absolute;
        inset: 0;
        z-index: 7;
        pointer-events: none;
      }

      .bokeh {
        position: absolute;
        border-radius: 50%;
        background: rgba(245, 183, 59, 0.45);
        filter: blur(2px);
      }

      /* Cinematic Transition VFX (Dip-to-Black & Golden Light Leak) */
      #fxBlackout {
        position: absolute;
        inset: 0;
        z-index: 12;
        background: #050608;
        opacity: 0;
        pointer-events: none;
      }

      #fxFlash {
        position: absolute;
        inset: 0;
        z-index: 14;
        background: radial-gradient(circle at 50% 45%, rgba(255, 224, 150, 0.9), rgba(245, 183, 59, 0.25) 65%, transparent 100%);
        opacity: 0;
        pointer-events: none;
      }

      /* ── Layer 2: Scene-Specific Cinema Overlays (Strictly inside IG Safe Zone) ── */
      #sceneOverlays {
        position: absolute;
        inset: 0;
        z-index: 20;
        pointer-events: none;
      }

      .sc-layer {
        position: absolute;
        top: 280px;
        left: 90px;
        right: 145px;
        height: 790px;
        opacity: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
      }

      /* Hook Cold Open */
      .story-stamp {
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 18px;
        border-radius: 8px;
        background: rgba(8, 9, 13, 0.78);
        border: 2px solid rgba(245, 183, 59, 0.7);
        font-family: "JetBrains Mono", monospace;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: var(--gold);
        text-transform: uppercase;
        margin-bottom: 22px;
      }

      .hook-cinema-title {
        font-family: "Archivo Black", "Inter", sans-serif;
        font-size: 66px;
        line-height: 1.04;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        color: #ffffff;
        text-shadow: 0 8px 34px rgba(0, 0, 0, 0.96), 0 2px 8px rgba(0, 0, 0, 0.98);
        overflow-wrap: break-word;
      }

      .hl-gold {
        color: var(--gold);
      }

      .hl-red {
        color: var(--crimson);
      }

      .hook-cinema-sub {
        margin-top: 18px;
        font-size: 32px;
        line-height: 1.24;
        font-weight: 700;
        color: #f0ece2;
        text-shadow: 0 5px 22px rgba(0, 0, 0, 0.98);
      }

      /* Realistic iOS Dark Lockscreen Notification */
      .lock-wrap {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 20px;
      }

      .lock-clock {
        font-family: "Inter", sans-serif;
        font-size: 112px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.04em;
        color: rgba(255, 255, 255, 0.95);
        text-shadow: 0 8px 36px rgba(0, 0, 0, 0.75);
        margin-bottom: 8px;
      }

      .lock-date {
        font-size: 26px;
        font-weight: 600;
        color: rgba(240, 236, 226, 0.9);
        text-shadow: 0 4px 16px rgba(0, 0, 0, 0.85);
        margin-bottom: 34px;
      }

      .ios-glass-card {
        width: 100%;
        background: rgba(22, 24, 32, 0.84);
        border: 1.5px solid rgba(255, 255, 255, 0.22);
        border-radius: 26px;
        padding: 24px 28px;
        box-shadow: 0 26px 64px rgba(0, 0, 0, 0.65);
        position: relative;
      }

      .ios-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        font-family: "JetBrains Mono", monospace;
        font-size: 22px;
        font-weight: 700;
        color: #5ee29a;
      }

      .ios-sender {
        font-size: 32px;
        font-weight: 800;
        color: #ffffff;
        margin-bottom: 6px;
      }

      .ios-body {
        font-size: 34px;
        line-height: 1.24;
        font-weight: 600;
        color: #f4f1ea;
      }

      .ios-seen-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid rgba(255, 255, 255, 0.14);
        font-family: "JetBrains Mono", monospace;
        font-size: 23px;
        font-weight: 700;
        color: #6cc4ff;
      }

      .drama-stamp {
        position: absolute;
        right: 22px;
        bottom: -24px;
        padding: 10px 22px;
        background: var(--crimson);
        color: #ffffff;
        font-family: "Archivo Black", "Inter", sans-serif;
        font-size: 24px;
        letter-spacing: 0.05em;
        border: 3px solid #ffffff;
        border-radius: 8px;
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.6);
      }

      /* Dramatic Twist Statement (pure movie typography, zero box) */
      .twist-wrap {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 20px;
      }

      .twist-kicker {
        font-family: "JetBrains Mono", monospace;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.16em;
        color: var(--gold);
        text-transform: uppercase;
        text-shadow: 0 4px 16px rgba(0, 0, 0, 0.95);
      }

      .twist-serif {
        font-family: "Playfair Display", Georgia, serif;
        font-style: italic;
        font-weight: 700;
        font-size: 66px;
        line-height: 1.1;
        color: #ffffff;
        text-shadow: 0 8px 34px rgba(0, 0, 0, 0.98);
      }

      .twist-rule {
        width: 240px;
        height: 5px;
        background: var(--crimson);
        transform-origin: left center;
      }

      .twist-sub {
        font-size: 34px;
        line-height: 1.24;
        font-weight: 700;
        color: #f2ede2;
        text-shadow: 0 5px 22px rgba(0, 0, 0, 0.98);
      }

      /* Floating Minimalist Science / Documentary Telemetry Strip */
      .neuro-hud {
        margin-top: 26px;
        background: rgba(10, 12, 18, 0.76);
        border-left: 6px solid var(--gold);
        border-radius: 0 18px 18px 0;
        padding: 24px 28px;
        box-shadow: 0 22px 54px rgba(0, 0, 0, 0.55);
      }

      .neuro-tag {
        font-family: "JetBrains Mono", monospace;
        font-size: 23px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: var(--gold);
        margin-bottom: 10px;
        text-transform: uppercase;
      }

      .neuro-main {
        font-size: 38px;
        line-height: 1.18;
        font-weight: 800;
        color: #ffffff;
        margin-bottom: 14px;
      }

      /* Native Instagram Comment + DM Proof Overlay */
      .cta-cinema-wrap {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .dm-pill {
        background: rgba(252, 250, 245, 0.96);
        color: #111216;
        border-radius: 22px;
        padding: 18px 22px;
        display: flex;
        align-items: center;
        gap: 16px;
        box-shadow: 0 24px 56px rgba(0, 0, 0, 0.65);
        opacity: 0;
      }

      .dm-badge {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: #0d0e12;
        color: var(--gold);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Playfair Display", serif;
        font-weight: 700;
        font-style: italic;
        font-size: 28px;
        flex-shrink: 0;
      }

      .ig-drawer {
        background: rgba(255, 255, 255, 0.96);
        color: #111216;
        border-radius: 26px;
        padding: 22px 26px;
        box-shadow: 0 28px 68px rgba(0, 0, 0, 0.72);
      }

      .ig-drawer-head {
        text-align: center;
        font-size: 26px;
        font-weight: 800;
        padding-bottom: 12px;
        border-bottom: 1.5px solid #e4e1d9;
        margin-bottom: 14px;
      }

      .ig-row {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 14px;
      }

      .ig-av {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: #121318;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 22px;
      }

      .ig-bar {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border: 2px solid #d5d1c8;
        border-radius: 99px;
        padding: 12px 20px;
      }

      .ig-btn {
        background: #0095f6;
        color: #fff;
        padding: 8px 20px;
        border-radius: 99px;
        font-size: 24px;
        font-weight: 800;
      }

      /* ── Layer 3: Cinema End Poster (Last 2.2s) ── */
      #endPoster {
        position: absolute;
        inset: 0;
        z-index: 35;
        background: rgba(8, 9, 13, 0.9);
        opacity: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        padding: 240px 145px 540px 90px;
      }

      .poster-seal {
        width: 96px;
        height: 96px;
        border: 3px solid var(--gold);
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Playfair Display", Georgia, serif;
        font-size: 46px;
        font-weight: 700;
        font-style: italic;
        color: var(--gold);
        margin-bottom: 24px;
      }

      .poster-title {
        font-family: "Archivo Black", "Inter", sans-serif;
        font-size: 74px;
        line-height: 0.98;
        color: #ffffff;
        margin-bottom: 16px;
      }

      .poster-bar {
        width: 190px;
        height: 5px;
        background: var(--crimson);
        margin-bottom: 22px;
      }

      .poster-tags {
        font-family: "JetBrains Mono", monospace;
        font-size: 24px;
        font-weight: 700;
        color: #d6d0c4;
        margin-bottom: 28px;
      }

      .poster-cta {
        padding: 18px 26px;
        border-radius: 14px;
        background: var(--crimson);
        color: #ffffff;
        font-size: 30px;
        font-weight: 800;
      }

      .poster-handle {
        margin-top: 20px;
        font-family: "JetBrains Mono", monospace;
        font-size: 25px;
        color: var(--gold);
      }

      /* ── Layer 4: Clean Floating Cinema Subtitles (ZERO ugly box!) ── */
      #captionsLayer {
        position: absolute;
        left: 90px;
        right: 145px;
        top: 1125px;
        height: 155px;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }

      .cap-chunk {
        position: absolute;
        display: inline-flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 6px 14px;
        text-align: center;
        opacity: 0;
      }

      .w {
        display: inline-block;
        font-family: "Inter", sans-serif;
        font-size: 52px;
        line-height: 1.14;
        font-weight: 900;
        letter-spacing: -0.02em;
        color: #ffffff;
        text-shadow:
          0 6px 24px rgba(0, 0, 0, 0.98),
          0 2px 6px rgba(0, 0, 0, 1),
          0 0 2px rgba(0, 0, 0, 1);
      }

      /* Top slim progress hairline (subtle, unobtrusive) */
      .cinema-top-rail {
        position: absolute;
        top: 130px;
        left: 90px;
        right: 145px;
        z-index: 42;
        display: flex;
        align-items: center;
        gap: 14px;
        pointer-events: none;
      }

      .rail-track {
        flex: 1;
        height: 4px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.24);
        overflow: hidden;
      }

      .rail-fill {
        width: 100%;
        height: 100%;
        background: var(--gold);
        transform-origin: left center;
      }

      .rail-handle {
        font-family: "JetBrains Mono", monospace;
        font-size: 20px;
        font-weight: 700;
        color: rgba(250, 247, 240, 0.9);
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__DURATION__" data-width="1080" data-height="1920">
      <!-- 100% Full-Bleed Multi-Shot Cinema Movie -->
      <div id="cinemaStage">
        __SHOTS_HTML__
        <div class="cinema-veil" data-layout-ignore="true"></div>
      </div>

      <!-- Subtle Drifting Atmospheric Bokeh -->
      <div class="bokeh-layer" data-layout-ignore="true">
        <div class="bokeh" id="bk0" style="width: 5px; height: 5px; left: 140px; top: 420px"></div>
        <div class="bokeh" id="bk1" style="width: 4px; height: 4px; left: 760px; top: 340px"></div>
        <div class="bokeh" id="bk2" style="width: 6px; height: 6px; left: 320px; top: 880px"></div>
        <div class="bokeh" id="bk3" style="width: 4px; height: 4px; left: 820px; top: 960px"></div>
        <div class="bokeh" id="bk4" style="width: 5px; height: 5px; left: 210px; top: 1380px"></div>
        <div class="bokeh" id="bk5" style="width: 4px; height: 4px; left: 680px; top: 1490px"></div>
      </div>

      <!-- Cinema Transition VFX -->
      <div id="fxBlackout" data-layout-ignore="true"></div>
      <div id="fxFlash" data-layout-ignore="true"></div>

      <!-- Scene-by-Scene Synced Cinema Overlays -->
      <div id="sceneOverlays">__SCENES_HTML__</div>

      <!-- Luxury Cinema End Poster -->
      <div id="endPoster">
        <div class="poster-seal">CZ</div>
        <div class="poster-title">CÓDIGO<br />ZERO</div>
        <div class="poster-bar"></div>
        <div class="poster-tags">PROTOCOLO 14 DIAS • CENTRAL SOS • 16 SCRIPTS</div>
        <div class="poster-cta">Comente ZERO ou chame: (12) 99659-3222</div>
        <div class="poster-handle">@protocolocodigozero</div>
      </div>

      <!-- Floating Cinema Subtitles (zero bounding box) -->
      <div id="captionsLayer" data-layout-allow-caption-zone="true">__CAPTIONS_HTML__</div>

      <!-- Top Slim Film Progress Rail -->
      <div class="cinema-top-rail" data-layout-ignore="true">
        <div class="rail-track"><div class="rail-fill" id="masterRail"></div></div>
        <div class="rail-handle">@protocolocodigozero</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const DUR = __DURATION__;
      const SCENES = __SCENES_META_JSON__; // [{idx, start, end, fx, overlay_type}, ...]
      const POSTER_AT = __POSTER_AT__;
      const CHUNKS = __CHUNKS_JSON__;

      const tl = gsap.timeline({ paused: true });

      // Top rail progress
      tl.fromTo("#masterRail", { scaleX: 0 }, { scaleX: 1, duration: DUR, ease: "none" }, 0);

      // Gentle ambient dust drift
      for (let i = 0; i < 6; i++) {
        tl.fromTo(
          "#bk" + i,
          { x: 0, y: 0, opacity: 0.25 },
          { x: (i % 2 === 0 ? 1 : -1) * 48, y: -140 - i * 18, opacity: 0.65, duration: DUR, ease: "none" },
          0
        );
      }

      // Scene-driven exact animations (100% synced to spoken words!)
      SCENES.forEach((sc, i) => {
        const sid = "#sc-" + i;
        const st = sc.start;
        const en = sc.end;
        const span = Math.max(0.8, en - st);

        // Transition FX entering scene
        if (sc.fx === "dark_drop" && i > 0) {
          tl.fromTo("#fxBlackout", { opacity: 0 }, { opacity: 0.96, duration: 0.14, ease: "power2.in" }, Math.max(0, st - 0.18));
          tl.to("#fxBlackout", { opacity: 0, duration: 0.22, ease: "power2.out" }, st + 0.04);
        } else if (sc.fx === "warm_flash" && i > 0) {
          tl.fromTo("#fxFlash", { opacity: 0 }, { opacity: 0.62, duration: 0.09, ease: "power2.out" }, Math.max(0, st - 0.06));
          tl.to("#fxFlash", { opacity: 0, duration: 0.24, ease: "power2.in" }, st + 0.03);
        }

        // Frame 0 starts fully visible immediately (no blank first frame!)
        if (i === 0) {
          tl.fromTo(sid, { opacity: 1, y: 0 }, { opacity: 1, y: 0, duration: 0.05 }, 0);
        } else {
          tl.fromTo(sid, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.24, ease: "power4.out" }, st);
        }

        // Internal micro-choreography by overlay type
        if (sc.overlay_type === "phone_lockscreen" || sc.overlay_type === "whatsapp_draft") {
          const card = sid + " .ios-glass-card";
          const stamp = sid + " .drama-stamp";
          if (document.querySelector(card)) {
            tl.fromTo(card, { y: 28, scale: 0.95, opacity: 0.2 }, { y: 0, scale: 1, opacity: 1, duration: 0.34, ease: "power4.out" }, st + 0.06);
          }
          if (document.querySelector(stamp)) {
            tl.fromTo(stamp, { scale: 1.45, rotation: -12, opacity: 0 }, { scale: 1, rotation: -3, opacity: 1, duration: 0.22, ease: "power4.out" }, st + Math.min(1.1, span * 0.42));
          }
        } else if (sc.overlay_type === "twist_card") {
          const rule = sid + " .twist-rule";
          if (document.querySelector(rule)) {
            tl.fromTo(rule, { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, st + 0.14);
          }
        } else if (sc.overlay_type === "neuro_hud") {
          const path = sid + " .hud-pulse";
          if (document.querySelector(path)) {
            tl.to(path, { strokeDashoffset: 0, duration: Math.min(1.6, span * 0.6), ease: "power2.out" }, st + 0.15);
          }
        } else if (sc.overlay_type === "ig_dm_cta") {
          const ph = sid + " .ig-ph";
          const typed = sid + " .ig-zero";
          const newc = sid + " .ig-new";
          const dm = sid + " .dm-pill";
          if (document.querySelector(ph)) {
            tl.to(ph, { opacity: 0, duration: 0.08 }, st + 0.35);
            tl.fromTo(typed, { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power2.out" }, st + 0.42);
            tl.fromTo(newc, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.22, ease: "power3.out" }, st + 0.62);
            tl.fromTo(dm, { opacity: 0, y: -28 }, { opacity: 1, y: 0, duration: 0.28, ease: "power4.out" }, st + 0.78);
          }
        }

        // Clean exit before next scene (or before End Poster)
        const exitAt = Math.max(st + 0.4, en - 0.16);
        tl.to(sid, { opacity: 0, y: -18, duration: 0.16, ease: "power2.in" }, exitAt);
      });

      // End Poster (Last ~2.2s)
      tl.to("#captionsLayer", { opacity: 0, duration: 0.14 }, Math.max(0.5, POSTER_AT - 0.14));
      tl.fromTo("#endPoster", { opacity: 0 }, { opacity: 1, duration: 0.26, ease: "power2.out" }, POSTER_AT);

      // Word-by-word Floating Cinema Captions (clean crisp gold/crimson highlight, zero box)
      CHUNKS.forEach((chunk, ci) => {
        const cid = "#chunk-" + ci;
        const cStart = Math.max(0, chunk.start);
        const cEnd = Math.min(POSTER_AT - 0.15, chunk.end);
        if (cStart >= POSTER_AT - 0.2) return;
        tl.fromTo(cid, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.08, ease: "power3.out" }, cStart);
        chunk.words.forEach((w, wi) => {
          const wid = "#w-" + ci + "-" + wi;
          const ws = Math.max(cStart, w.start);
          const we = Math.min(cEnd, w.end);
          const hiColor = w.emphasis ? "#ff3b5c" : "#f5b73b";
          tl.fromTo(
            wid,
            { color: "#ffffff", scale: 1 },
            { color: hiColor, scale: 1.09, duration: 0.04, ease: "power2.out" },
            ws
          );
          if (wi < chunk.words.length - 1) {
            tl.to(wid, { color: "#ffffff", scale: 1, duration: 0.06, ease: "power2.in" }, Math.max(ws + 0.08, we));
          }
        });
        tl.to(cid, { opacity: 0, y: -8, duration: 0.07, ease: "power2.in" }, Math.max(cStart + 0.1, cEnd));
      });

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
